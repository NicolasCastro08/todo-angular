<form class="todo-form" (ngSubmit)="submit()">
    <label class="sr-only" for="todo-title">Nova Tarefa</label>
    <input 
        type="text"
        name="title"
        type="text"
        placeholder="Digite uma tarefa"
        autocapitalize="off"
        [{ngModel}]="title"
    />
    <button type="submit">Adicionar</button>
</form>
